name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_APP: ${{ github.repository }}

jobs:
  build-and-push-app:
    name: Build and Push App Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v7
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_APP }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      
      - name: Build and push app image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  release-helm-chart:
    name: Release Helm Chart
    runs-on: ubuntu-latest
    needs: [build-and-push-app]
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    steps:
      - name: Create actual-assist bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.ACTUAL_ASSIST_BOT_ID }}
          private-key: ${{ secrets.ACTUAL_ASSIST_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: write

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && 'v0.8.0' || github.ref }}
          token: ${{ steps.app-token.outputs.token }}
      
      - name: Configure Git
        run: |
          git config user.name "actual-assist-bot[bot]"
          git config user.email "actual-assist-bot[bot]@users.noreply.github.com"
      
      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: '4.2.4'
      
      - name: Lint Helm chart
        run: helm lint charts/actual-assist/

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: charts
          version: v1.8.1
          skip_existing: true
        env:
          CR_TOKEN: "${{ steps.app-token.outputs.token }}"

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-and-push-app, release-helm-chart]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      
      - name: Extract version
        id: version
        run: |
          echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
      
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ startsWith(steps.version.outputs.version, 'v0.') }}
          generate_release_notes: true
          body: |
            ## Docker Images
            
            **App**: `${{ env.REGISTRY }}/${{ env.IMAGE_APP }}:${{ steps.version.outputs.version }}`
            
            ## Helm Chart
            
            ```bash
            helm repo add actual-assist https://${{ github.repository_owner }}.github.io/actual-assist
            helm repo update
            helm install actual-assist actual-assist/actual-assist --version ${{ steps.version.outputs.version }}
            ```
            
            ## Quick Start
            
            See [charts/actual-assist/README.md](https://github.com/${{ github.repository }}/blob/${{ steps.version.outputs.version }}/charts/actual-assist/README.md) for installation instructions.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
