{{- if .Values.tunnel.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "actual-assist.fullname" . }}-tunnel
data:
  config.yaml: |
    config_version: 1
    control_plane:
      base_url: https://api.openai.com
      tunnel_id: {{ .Values.tunnel.tunnelId | quote }}
      api_key: env:CONTROL_PLANE_API_KEY
      poll_channels: [main]
    mcp:
      server_urls:
        - channel: main
          url: http://127.0.0.1:{{ .Values.integrations.port }}/integrations/mcp
      extra_headers:
        Authorization: env:ACTUAL_MCP_AUTHORIZATION
      discovery_extra_headers:
        Authorization: env:ACTUAL_MCP_AUTHORIZATION
      startup_wait_timeout: 60s
      max_concurrent_requests: 4
    health:
      listen_addr: 127.0.0.1:8080
    log:
      level: info
      format: json
{{- end }}
