# Default values for actual-assist Helm chart
# This is a YAML-formatted file declaring variables to be passed into templates

# Application configuration
app:
  # One SQLite writer; 0 is permitted only for coordinated maintenance.
  # The chart rejects other counts and uses Recreate (no rolling overlap).
  replicaCount: 1
  image:
    repository: ghcr.io/mathewab/actual-assist
    pullPolicy: IfNotPresent
    tag: ""  # Defaults to Chart.appVersion

  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000

  resources:
    requests:
      memory: "256Mi"
      cpu: "200m"
    limits:
      memory: "1Gi"

  livenessProbe:
    httpGet:
      path: /health
      port: 3000
    initialDelaySeconds: 30
    periodSeconds: 10

  readinessProbe:
    httpGet:
      path: /ready
      port: 3000
    initialDelaySeconds: 5
    periodSeconds: 5

  podSecurityContext:
    fsGroup: 65532
    fsGroupChangePolicy: OnRootMismatch

  containerSecurityContext:
    runAsUser: 65532
    runAsGroup: 65532
    runAsNonRoot: true
    allowPrivilegeEscalation: false

# Storage configuration
storage:
  # Optional pre-provisioned/restored claim in this namespace.
  # The original chart-owned PVC remains rendered even when this is set.
  existingClaim: ""
  className: standard
  size: 1Gi
  mountPath: /data

# Docker registry credentials (optional)
imagePullSecrets: []

# Node selector for scheduling
nodeSelector: {}

# Tolerations for scheduling
tolerations: []

# Affinity rules for scheduling
affinity: {}

# Ingress configuration
ingress:
  enabled: false

# Secret management - provide values in actual deployment
secrets:
  # Set to false to use an externally managed Secret (Flux + ExternalSecrets/SOPS)
  create: true
  # If using an external Secret, set its name here
  existingSecretName: ""
  openaiApiKey: ""  # OPENAI_API_KEY
  actualServerUrl: ""  # ACTUAL_SERVER_URL
  actualPassword: ""  # ACTUAL_PASSWORD
  actualBudgetId: ""  # ACTUAL_BUDGET_ID (optional, single budget POC)

# Environment variables
env:
  nodeEnv: production
  scheduledSyncEnabled: true  # false disables only scheduled sync, not startup download/sync
  syncIntervalMinutes: 360  # 6 hours default
  jobTimeoutMinutes: 60
  jobTimeoutCheckIntervalMinutes: 5
  sqliteDbPath: /data/actual-assist.db
  port: 3000
  dataDir: /data

# Machine integrations stay off until their access policy and token are provisioned.
integrations:
  enabled: false
  listener: shared
  port: 3001
  allowedOrigins: []
  # INTEGRATIONS_TOKEN must come from the existing externally managed Secret.

# Disabled until an operator verifies the image provenance and provisions scoped secrets.
tunnel:
  enabled: false
  image: "" # ghcr.io/openai/tunnel-client@sha256:<verified digest>
  tunnelId: ""
  existingSecretName: ""
  runtimeKeyKey: runtime-api-key
  authorizationHeaderKey: actual-authorization-header
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 256Mi
